<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>metodos</title>
</head>
<body>

  <input type="number" id="numero">
  <button id="boton">Verificar</button>

  <script>
    const numero = document.querySelector("#numero");
    const boton = document.querySelector("#boton");

    function esPrimo(n) {
      if (n <= 1) return false;

      for (let i = 2; i < n; i++) {
        if (n % i === 0) {
          return false;
        }
      }

      return true;
    }

    boton.addEventListener("click", () => {
      const valor = Number(numero.value);

      if (numero.value === "") {
        alert("Escribe un número");
        return;
      }

      let tipo = "";
      let primo = "";

      if (valor % 2 === 0) {
        tipo = "par";
      } else {
        tipo = "impar";
      }

      if (esPrimo(valor)) {
        primo = "y primo";
      } else {
        primo = "y no es primo";
      }

      alert("El número es " + tipo + " " + primo);
    });
  </script>

</body>
</html>
